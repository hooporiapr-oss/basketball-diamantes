<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Para el coach · Diamantes de Arecibo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.mini{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:3px;
  padding:5px 9px;font:inherit;font-size:.74rem;font-weight:800;cursor:pointer}
.mini:hover{border-color:var(--ink)}
.mini.bad{color:var(--bad);border-color:rgba(168,50,63,.35)}
.mini.bad:hover{border-color:var(--bad)}
</style>
</head>
<body>

<header><div class="wrap bar"></div></header>

<main>
  <div class="wrap">
    <div class="kick">Para el coach</div>
    <h1>Quién ha estudiado qué.</h1>
    <p class="lede">Se actualiza solo. Cada jugador aparece cuando se registra, las lecciones
      se marcan cuando las completa, y el certificado se gana con 80% o más en un grupo
      de preguntas.</p>
    <div id="out"><p class="mute">Cargando…</p></div>
  </div>
</main>

<footer>
  <b>Diamantes de Arecibo</b>
  Conceptos de Rouldan A. Vélez
</footer>

<script src="dia.js"></script>
<script src="lessons.js"></script>
<script>
chrome({ title:'Coach' });

// El código se guarda solo mientras la pestaña esté abierta.
function coachCode(){
  try { return sessionStorage.getItem('dia-coach') || ''; } catch(e){ return ''; }
}
function setCoachCode(c){
  try { sessionStorage.setItem('dia-coach', c); } catch(e){}
}

function askCode(){
  var c = prompt('Código del coach:');
  if (c === null) return null;
  setCoachCode(c);
  return c;
}

// Every action sends the code; the database decides whether it counts.
function coachCall(fn, args){
  var c = coachCode() || askCode();
  if (!c) return Promise.resolve(null);
  args.p_code = c;
  return rpc(fn, args).then(function(r){
    if (r && r.ok === false && r.reason === 'code'){
      try { sessionStorage.removeItem('dia-coach'); } catch(e){}
      alert('Código incorrecto.');
      return null;
    }
    return r;
  });
}

function addPlayer(){
  var name = prompt('Nombre del jugador:');
  if (!name) return;
  var team = prompt('Equipo o categoría (opcional):') || '';
  var pin  = prompt('PIN de 4 números (opcional — lo puede poner él después):') || '';

  coachCall('dia_coach_add', { p_name: name, p_team: team, p_pin: pin })
    .then(function(r){
      if (!r) return;
      if (!r.ok){
        alert(r.reason === 'exists' ? 'Ese nombre ya está registrado.' : 'No se pudo añadir.');
        return;
      }
      location.reload();
    })
    .catch(function(e){ console.error(e); alert('No se pudo añadir.'); });
}

function removePlayer(id, name){
  if (!confirm('¿Borrar a ' + name + '? Se pierde su progreso y sus notas.')) return;
  coachCall('dia_coach_remove', { p_player: id })
    .then(function(r){ if (r && r.ok) location.reload(); })
    .catch(function(e){ console.error(e); alert('No se pudo borrar.'); });
}

function resetPin(id, name){
  var pin = prompt('PIN nuevo para ' + name + ' (4 números):');
  if (pin === null) return;
  if (pin && !/^\d{4}$/.test(pin)) return alert('El PIN son 4 números.');
  coachCall('dia_coach_pin', { p_player: id, p_pin: pin })
    .then(function(r){ if (r && r.ok) alert('PIN cambiado.'); })
    .catch(function(e){ console.error(e); alert('No se pudo cambiar.'); });
}

var out = document.getElementById('out');

Promise.all([
  api('dia_players?select=id,name,team&order=name.asc'),
  api('dia_progress?select=player_id,lesson'),
  api('dia_quiz?select=player_id,set_key,correct,total,taken_at&order=taken_at.desc')
])
.then(function(res){
  var players = res[0] || [], progress = res[1] || [], quizzes = res[2] || [];

  if (!players.length){
    out.innerHTML = '<p class="mute">Todavía no se ha registrado nadie. ' +
      'Comparte el enlace con el equipo.</p>' +
      '<button class="btn" onclick="addPlayer()">+ Añadir jugador</button>';
    return;
  }

  var doneBy = {};
  progress.forEach(function(r){
    (doneBy[r.player_id] = doneBy[r.player_id] || {})[r.lesson] = 1;
  });

  // the best score each player has posted, which is what a coach asks
  var bestBy = {}, passedBy = {};
  quizzes.forEach(function(q){
    var pct = Math.round(q.correct / Math.max(1, q.total) * 100);
    if (!bestBy[q.player_id] || pct > bestBy[q.player_id]) bestBy[q.player_id] = pct;
    // 80% earns the certificate for that group
    if (pct >= 80){
      (passedBy[q.player_id] = passedBy[q.player_id] || {})[q.set_key] = 1;
    }
  });

  var SET_SHORT = { def:'Defensa', off:'Ataque', all:'Completo', quick:'Rápido' };

  var total = LESSONS.length;

  var rows = players.map(function(p){
    var done = Object.keys(doneBy[p.id] || {}).length;
    var best = bestBy[p.id];
    var certs = Object.keys(passedBy[p.id] || {})
      .map(function(k){ return SET_SHORT[k] || k; });

    return '<tr>' +
      '<td><b>' + esc(p.name) + '</b>' + (p.team ? '<br><span class="mute" style="font-size:.84rem">' + esc(p.team) + '</span>' : '') + '</td>' +
      '<td>' + done + ' / ' + total + '</td>' +
      '<td>' + (best === undefined ? '<span class="mute">—</span>' : best + '%') + '</td>' +
      '<td>' + (certs.length
                 ? '<span style="color:var(--good);font-weight:800">' + certs.join(' · ') + '</span>'
                 : '<span class="mute">—</span>') + '</td>' +
      '<td style="white-space:nowrap">' +
        '<button class="mini" onclick="resetPin(\'' + p.id + '\',\'' + esc(p.name).replace(/'/g,"\\'") + '\')">PIN</button> ' +
        '<button class="mini bad" onclick="removePlayer(\'' + p.id + '\',\'' + esc(p.name).replace(/'/g,"\\'") + '\')">Borrar</button>' +
      '</td>' +
    '</tr>';
  }).join('');

  // which lessons the team as a whole has not done
  var perLesson = LESSONS.map(function(l){
    var n = players.filter(function(p){ return (doneBy[p.id] || {})[l.id]; }).length;
    return { name: l.name, n: n };
  }).sort(function(a, b){ return a.n - b.n; });

  out.innerHTML =
    '<button class="btn" onclick="addPlayer()">+ Añadir jugador</button>' +
    '<table><tr><th>Jugador</th><th>Lecciones</th><th>Mejor nota</th><th>Certificados</th><th></th></tr>' +
      rows + '</table>' +

    '<h2>Por lección</h2>' +
    '<table><tr><th>Lección</th><th>Lo estudiaron</th></tr>' +
      perLesson.map(function(l){
        return '<tr><td>' + l.name + '</td><td>' + l.n + ' / ' + players.length + '</td></tr>';
      }).join('') +
    '</table>' +

    '<h2>Últimas pruebas</h2>' +
    (quizzes.length
      ? '<table><tr><th>Jugador</th><th>Grupo</th><th>Nota</th></tr>' +
          quizzes.slice(0, 15).map(function(q){
            var who = players.filter(function(p){ return p.id === q.player_id; })[0];
            return '<tr><td>' + esc(who ? who.name : '—') + '</td><td>' + esc(q.set_key) + '</td>' +
                   '<td>' + q.correct + ' / ' + q.total + '</td></tr>';
          }).join('') +
        '</table>'
      : '<p class="mute">Todavía nadie ha hecho las preguntas.</p>');
})
.catch(function(e){
  console.error(e);
  out.innerHTML = '<p class="mute">No se pudieron cargar los datos.</p>';
});

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
  });
}
</script>
</body>
</html>
